name: Publish to npm (manual — currently blocked)

# 本包声明了 contentPolicy: dual-use（见 DISCLOSURE），按 npm 的 Dual-Use Content Policy，
# 发布必须走 staged publishing：先用任意凭证 stage，再由维护者用 2FA 提升。相关步骤保留在下方。
#
# 当前状态：npm 的发布前扫描（publish-time scanning）把本包（1.1.0 / 1.1.3）判定为 blocked，
# npm 发布通道不可用。因此本 workflow 改为**仅手动触发**，避免打 tag 时产生失败的运行。
# 分发通道为 GitHub：dsh plugin add github:dhicoc/dsh-reverse-skill
#
# 若将来恢复：手动运行本 workflow 完成 stage（stage 不需要 2FA），然后在本地执行
#   npm stage list @dhicoc/dsh-reverse-skill
#   npm stage approve <stage-id>        # 此步需要 2FA
on:
  workflow_dispatch:

jobs:
  stage:
    runs-on: ubuntu-latest
    # 只需读代码；凭证通过 NODE_AUTH_TOKEN 传入，不需要写权限。
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # staged publishing 需要 npm >= 11.6；Node 22 自带的 npm 10.x 不支持。
      - name: Upgrade npm
        run: npm install -g npm@latest

      # lib/ 已随仓库提交；npm install 仅装 devDependencies 以便 prepublishOnly 重跑 tsc。
      # package-lock.json 可能与 package.json 不同步，故用 npm install（会自动 reconcile），不用 npm ci。
      - name: Install dependencies
        run: npm install

      - name: Verify bundled skill provider
        run: npm test

      - name: Stage release on npm
        run: npm stage publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
